<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <title>Peach-Printer 模版编辑器 3.0</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="Keywords" content="web打印,peach-printer,前端自动分页打印" />
    <meta name="Description" content="Peach-Printer是一款优秀的Web打印解决方案，支持无需预览直接打印、表格分页汇总、调用简单，兼容主流浏览器及IE。" />
    <link rel="shortcut icon" href="logo.png">
    <script src="core/peach-jprinter-min.js?v=20260313"></script>
</head>

<body>
    <button id="preview">预览</button>
    <button id="print">打印</button>
    <script>
        document.getElementById("preview").addEventListener("click", async () => {
            const datasource = await loadData("data/data3.json")
            const template = await loadData("data/template3.json")
            const licence = {
                code: "",
                name: "",
            };
            PeachPrinter.preview(template, datasource.maindata, datasource.listdata, licence, (result) => {
                console.info(result)
            })
        })
        document.getElementById("print").addEventListener("click", async () => {
            const datasource = await loadData("data/data3.json")
            const template = await loadData("data/template3.json")
            const licence = {
                code: "",
                name: "",
            };
            PeachPrinter.print(template, datasource.maindata, datasource.listdata, licence, (result) => {
                console.info(result)
            })
        })

        async function loadData(url) {
            const response = await fetch(url, {
                headers: {
                    'Content-Type': 'application/json',
                },
            });
            // 检查响应状态
            if (!response.ok) {
                throw new Error(`HTTP错误! 状态码: ${response.status}`);
            }
            // 解析JSON响应
            return await response.json();
        }
    </script>
</body>

</html>
